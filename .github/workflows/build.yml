on:
  push:
    branches:
      - 'main_ci'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    strategy:
      matrix:
        os: [
          ubuntu-latest,
          # windows-latest
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout vscode-glspc
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Importing package-lock.json for pnpm
        run: pnpm import

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: pnpm

      - name: Fetch dependencies
        run: pnpm fetch

      - name: Install dependencies
        run: pnpm install

      - name: Package the extension
        run: pnpm run package
